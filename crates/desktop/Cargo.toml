[package]
name = "dictation-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["dep:global-hotkey", "dep:arboard", "dep:windows-sys"]
tray = ["native", "dep:tray-icon"]

[dependencies]
dictation-domain = { path = "../domain" }
thiserror.workspace = true
global-hotkey = { version = "0.8.0", optional = true }

[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3.7.0", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.0", optional = true, default-features = false }

[lints]
workspace = true
