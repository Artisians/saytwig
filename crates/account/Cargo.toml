[package]
name = "saytwig-account"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cleanup-service = { path = "../cleanup" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
jsonwebtoken = "9.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }
tempfile = "3"


[lints]
workspace = true
