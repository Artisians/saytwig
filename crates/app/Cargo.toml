[package]
name = "dictation-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component", "assets"] }
dictation-domain = { path = "../domain" }
dictation-audio = { path = "../audio" }
phonon-service = { path = "../phonon" }
dictation-desktop = { path = "../desktop" }
saytwig-account = { path = "../account" }
cleanup-service = { path = "../cleanup" }
saytwig-updates = { path = "../updates" }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
open = "5"
anyhow.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "saytwig"
path = "src/main.rs"

[lints]
workspace = true
